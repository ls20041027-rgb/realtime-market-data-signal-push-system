
kafka:
  bootstrap_servers: ["127.0.0.1:9092"]
  group_id: "push-gateway-consumer"
  topic_market_data_normalized: "market_data_normalized"
  topic_trading_signals: "trading_signals"
  topic_system_events: "system_events"
  reconnect_wait: "2s"
  reconnect_max_wait: "60s"
  min_bytes: 1
  max_bytes: 10485760

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: ""
  pool_size: 32
  min_idle_conns: 4
  dial_timeout: "3s"
  read_timeout: "2s"
  write_timeout: "2s"

  quote_prefix: "quote:"
  indicator_prefix: "indicator:"
  tech_prefix: "tech:"
  capital_prefix: "capital:"
  fenbi_prefix: "fenbi:"
  finance_prefix: "finance:"
  hist_daily_prefix: "hist:daily:"
  stock_list_key: "stock_list"

postgres:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: ""
  database: "tornado_seeker"
  sslmode: "disable"
  max_open_conns: 16
  max_idle_conns: 4
  conn_max_lifetime: "30m"

http:
  listen_addr: ":8080"
  read_timeout: "15s"
  write_timeout: "30s"
  shutdown_timeout: "10s"

ws:
  read_timeout: "30s"
  write_timeout: "5s"
  ping_interval: "25s"
  quote_flush_interval: "200ms"
  client_send_buffer: 256
  max_connections: 500000
  read_buffer_size: 4096
  write_buffer_size: 4096

runtime:
  log_level: "info"
  metrics_enabled: true
  metrics_interval: "10s"
