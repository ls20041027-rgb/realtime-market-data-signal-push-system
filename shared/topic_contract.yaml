version: 2

naming_rule:
  topic_format: "dot_separated_for_input, lowercase_with_underscores_for_output"
  message_format: "Flat JSON per topic. No envelope wrapper. Common fields (symbol, timestamp, source) at top level."

downstream_compatibility:
  principles:
    - "Each topic carries exactly one message type. No routing by message_type field needed."
    - "Unknown fields must be ignored without interrupting the consumer."

common_fields:
  description: "Every message on every topic includes these fields at the top level."
  fields:
    - name: symbol
      type: string
      required: true
      description: "Security symbol or system identifier."
    - name: timestamp
      type: string
      required: true
      description: "Event timestamp in ISO 8601 format."
    - name: source
      type: string
      required: true
      description: "Producer service name."

topics:
  market.report:
    role: "Realtime quote snapshots"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized quote snapshots. Symbol prefixed (SH/SZ), prices Decimal-quantized, bid/ask arrays expanded to bid1..bid5."
    key_fields:
      - symbol
      - exchange
      - event_time
      - last_price
      - prev_close
      - volume
      - turnover
      - bid1_price
      - ask1_price

  market.fenbi:
    role: "Tick-by-tick transaction data"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized tick records. Direction (BUY/SELL/NEUTRAL) computed at ingestion."
    key_fields:
      - symbol
      - trade_time
      - price
      - volume
      - amount
      - direction
      - bid1
      - ask1

  market.mkttbl:
    role: "Security master data"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized security info records. Only security-level records emitted (market headers skipped)."
    key_fields:
      - symbol
      - name
      - exchange
      - lot_size

  market.finance:
    role: "Finance records"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized finance records. Shares/EPS/BPS Decimal-quantized, report_date as YYYY-MM-DD."
    key_fields:
      - symbol
      - report_date
      - total_shares
      - float_shares
      - eps
      - bps
      - net_profit

  market.filedata.history:
    role: "Daily kline history data"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized daily kline records. Fields: symbol, trade_date, open, high, low, close, volume, turnover."
    key_fields:
      - symbol
      - trade_date
      - open
      - high
      - low
      - close
      - volume
      - turnover

  market.filedata.minute:
    role: "Minute-level price data"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized minute bar records. Fields: symbol, trade_time, price, volume, turnover."
    key_fields:
      - symbol
      - trade_time
      - price
      - volume
      - turnover

  market.filedata.5minute:
    role: "5-minute kline data"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized 5-minute kline records. Fields: symbol, trade_time, open, high, low, close, volume, turnover, active_buy_vol."
    key_fields:
      - symbol
      - trade_time
      - open
      - high
      - low
      - close
      - volume
      - turnover
      - active_buy_vol

  market.filedata.power:
    role: "Ex-dividend / rights data"
    partitions: 1
    producer:
      - data_ingestion
    consumers:
      - stream_engine
    description: "Fully normalized power/rights records. Fields: symbol, ex_date, bonus, allotment, allotment_price, dividend."
    key_fields:
      - symbol
      - ex_date
      - bonus
      - allotment
      - allotment_price
      - dividend

  market_data_normalized:
    role: "Normalized market data (output)"
    partitions: 1
    producer:
      - stream_engine
    consumers:
      - push_gateway
    description: "Normalized snapshots for frontend consumption."

  trading_signals:
    role: "Trading signals (output)"
    partitions: 1
    producer:
      - stream_engine
    consumers:
      - push_gateway
    description: "Buy/sell signals generated by the strategy layer."

  system_events:
    role: "System events (output)"
    partitions: 1
    producer:
      - data_ingestion
      - stream_engine
      - push_gateway
    consumers:
      - push_gateway
    description: "Service lifecycle events, warnings, and runtime errors."
